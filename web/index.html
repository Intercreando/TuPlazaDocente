  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #F5F8F6;
      font-family: system-ui, sans-serif;
      color: #12201E;
    }
    #boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      min-height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      background: #F5F8F6;
      opacity: 1;
      transition: opacity 0.28s ease;
    }
    #boot.boot-out {
      opacity: 0;
      pointer-events: none;
    }
    #boot .lockup {
      width: min(240px, 68vw);
      height: auto;
      display: block;
      animation: bootIn 0.35s ease-out;
    }
    @keyframes bootIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    #boot .sub { margin: 16px 0 0; opacity: 0.7; min-height: 1.2em; }
  </style>

<body>
  <div id="boot">
    <div>
      <img class="lockup" src="icons/logo-boot.png" width="240" height="251" alt="TuPlazaDocente">
      <p class="sub" id="bootSub"></p>
    </div>
  </div>
  <script>
    (function () {
      var BUILD_KEY = 'tpd_web_build_id';

      // Captura temprana del diálogo nativo de instalación (Chrome/Edge).
      // Flutter carga después; sin esto se pierde el evento.
      window.__tpdDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__tpdDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('tpd-install-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__tpdDeferredPrompt = null;
      });

      function clearCachesAndWorkers() {
        var jobs = [];
        if ('serviceWorker' in navigator) {
          jobs.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            }).catch(function () {})
          );
        }
        if (window.caches && caches.keys) {
          jobs.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            }).catch(function () {})
          );
        }
        return Promise.all(jobs);
      }

      function registerInstallSw() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      }

      // Elimina el SW agresivo de Flutter (flutter_service_worker.js) que deja
      // builds viejos cacheados y la PWA se queda en "Cargando...".
      function purgeStaleFlutterWorker() {
        if (!('serviceWorker' in navigator)) return Promise.resolve(false);
        return navigator.serviceWorker.getRegistrations().then(function (regs) {
          var killed = false;
          return Promise.all(regs.map(function (reg) {
            var url = (reg.active && reg.active.scriptURL) ||
              (reg.waiting && reg.waiting.scriptURL) ||
              (reg.installing && reg.installing.scriptURL) || '';
            if (url.indexOf('flutter_service_worker.js') !== -1) {
              killed = true;
              return reg.unregister();
            }
            return Promise.resolve();
          })).then(function () { return killed; });
        }).catch(function () { return false; });
      }

      purgeStaleFlutterWorker().then(function (killed) {
        if (killed && window.caches && caches.keys) {
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }).then(function () { location.reload(); });
        }
      });

      // Limpia SW/caché cuando hay un build nuevo (actualizaciones).
      fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (info) {
          var id = String(info.build_number || '') + '-' + String(info.version || '');
          var prev = localStorage.getItem(BUILD_KEY);
          if (prev && prev !== id) {
            return clearCachesAndWorkers().then(function () {
              localStorage.setItem(BUILD_KEY, id);
              location.reload();
            });
          }
          localStorage.setItem(BUILD_KEY, id);
          registerInstallSw();
        })
        .catch(function () {
          registerInstallSw();
        });

      function hideBoot() {
        var boot = document.getElementById('boot');
        if (!boot || boot.classList.contains('boot-out')) return;
        boot.classList.add('boot-out');
        setTimeout(function () {
          if (boot.parentNode) boot.remove();
        }, 320);
      }

      // Flutter quita el overlay cuando la app está lista. Esto es respaldo.
      setTimeout(hideBoot, 8000);

      window.addEventListener('error', function (e) {
        var src = '';
        try {
          src = String((e.filename || (e.target && e.target.src) || ''));
        } catch (_) {}
        if (/googletagmanager|google-analytics|googleadservices|facebook\.net|fbevents|connect\.facebook/i.test(src)) {
          return;
        }
        var sub = document.getElementById('bootSub');
        if (sub) sub.textContent = 'Error: ' + (e.message || 'carga');
      });
      window.addEventListener('unhandledrejection', function (e) {
        var sub = document.getElementById('bootSub');
        if (sub) sub.textContent = 'Error: ' + (e.reason || 'promesa');
      });
    })();
  </script>
