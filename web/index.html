<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TuPlazaDocente: entrenador táctico del Concurso Docente CNSC/ICFES.">
  <meta name="theme-color" content="#0C2F2B">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TuPlazaDocente">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="preload" href="icons/logo-mark.svg" as="image" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <title>TuPlazaDocente</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #F5F8F6;
      font-family: system-ui, sans-serif;
      color: #12201E;
    }
    #boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      min-height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      background: #F5F8F6;
    }
    #boot .mark {
      width: min(120px, 36vw);
      height: auto;
      border-radius: 22px;
      display: block;
      margin: 0 auto 18px;
      object-fit: contain;
    }
    #boot .brand {
      margin: 0 0 10px;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(1.6rem, 4vw, 2rem);
      letter-spacing: -0.02em;
      color: #0C2F2B;
    }
    #boot .brand span { color: #E3A008; }
    #boot .sub { margin: 0; opacity: 0.75; }
  </style>
</head>
<body>
  <div id="boot">
    <div>
      <img class="mark" src="icons/logo-mark.svg" width="120" height="120" alt="TuPlazaDocente">
      <p class="brand"><span>TuPlaza</span>Docente</p>
      <p class="sub" id="bootSub">Cargando...</p>
    </div>
  </div>
  <script>
    (function () {
      var BUILD_KEY = 'tpd_web_build_id';

      // Captura temprana del diálogo nativo de instalación (Chrome/Edge).
      // Flutter carga después; sin esto se pierde el evento.
      window.__tpdDeferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__tpdDeferredPrompt = e;
        window.dispatchEvent(new CustomEvent('tpd-install-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__tpdDeferredPrompt = null;
      });

      function clearCachesAndWorkers() {
        var jobs = [];
        if ('serviceWorker' in navigator) {
          jobs.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            }).catch(function () {})
          );
        }
        if (window.caches && caches.keys) {
          jobs.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            }).catch(function () {})
          );
        }
        return Promise.all(jobs);
      }

      function registerInstallSw() {
        if (!('serviceWorker' in navigator)) return;
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      }

      // Elimina el SW agresivo de Flutter (flutter_service_worker.js) que deja
      // builds viejos cacheados y la PWA se queda en "Cargando...".
      function purgeStaleFlutterWorker() {
        if (!('serviceWorker' in navigator)) return Promise.resolve(false);
        return navigator.serviceWorker.getRegistrations().then(function (regs) {
          var killed = false;
          return Promise.all(regs.map(function (reg) {
            var url = (reg.active && reg.active.scriptURL) ||
              (reg.waiting && reg.waiting.scriptURL) ||
              (reg.installing && reg.installing.scriptURL) || '';
            if (url.indexOf('flutter_service_worker.js') !== -1) {
              killed = true;
              return reg.unregister();
            }
            return Promise.resolve();
          })).then(function () { return killed; });
        }).catch(function () { return false; });
      }

      purgeStaleFlutterWorker().then(function (killed) {
        if (killed && window.caches && caches.keys) {
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }).then(function () { location.reload(); });
        }
      });

      // Limpia SW/caché cuando hay un build nuevo (actualizaciones).
      fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (info) {
          var id = String(info.build_number || '') + '-' + String(info.version || '');
          var prev = localStorage.getItem(BUILD_KEY);
          if (prev && prev !== id) {
            return clearCachesAndWorkers().then(function () {
              localStorage.setItem(BUILD_KEY, id);
              location.reload();
            });
          }
          localStorage.setItem(BUILD_KEY, id);
          registerInstallSw();
        })
        .catch(function () {
          registerInstallSw();
        });

      function hideBoot() {
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
      }

      window.addEventListener('flutter-first-frame', function () {
        hideBoot();
      });
      // Si el engine tarda o falla en silencio, no dejar la pantalla congelada.
      setTimeout(hideBoot, 8000);

      window.addEventListener('error', function (e) {
        var sub = document.getElementById('bootSub');
        if (sub) sub.textContent = 'Error: ' + (e.message || 'carga');
        hideBoot();
      });
      window.addEventListener('unhandledrejection', function (e) {
        var sub = document.getElementById('bootSub');
        if (sub) sub.textContent = 'Error: ' + (e.reason || 'promesa');
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
