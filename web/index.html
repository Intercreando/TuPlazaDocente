<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TuPlazaDocente: entrenador táctico del Concurso Docente CNSC/ICFES.">
  <meta name="theme-color" content="#0C2F2B">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TuPlazaDocente">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>TuPlazaDocente</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #F5F8F6;
      font-family: system-ui, sans-serif;
      color: #12201E;
    }
    #boot {
      min-height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    #boot .mark {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #0C2F2B, #1F6B5C);
      color: #E3A008;
      font-weight: 700;
    }
    #boot p { margin: 0 0 8px; }
    #boot .sub { opacity: 0.75; }
  </style>
</head>
<body>
  <div id="boot">
    <div>
      <div class="mark">TP</div>
      <p><strong>TuPlazaDocente</strong></p>
      <p class="sub" id="bootSub">Cargando...</p>
    </div>
  </div>
  <script>
    (function () {
      function hideBoot() {
        var boot = document.getElementById('boot');
        if (boot) boot.remove();
      }

      // Cuando Flutter monta la vista, quitar el boot.
      var obs = new MutationObserver(function () {
        if (
          document.querySelector('flutter-view') ||
          document.querySelector('flt-glass-pane') ||
          document.querySelector('flt-scene')
        ) {
          hideBoot();
          obs.disconnect();
        }
      });
      obs.observe(document.documentElement, { childList: true, subtree: true });

      // Failsafe: nunca dejar el boot encima más de 10s.
      setTimeout(hideBoot, 10000);

      window.addEventListener('error', function (e) {
        var sub = document.getElementById('bootSub');
        if (sub) sub.textContent = 'Error: ' + (e.message || 'carga');
      });
      window.addEventListener('unhandledrejection', function (e) {
        var sub = document.getElementById('bootSub');
        if (sub) sub.textContent = 'Error: ' + (e.reason || 'promesa');
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
