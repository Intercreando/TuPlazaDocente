name: tu_plaza_docente
description: "TuPlazaDocente — PWA entrenadora del Concurso Docente CNSC/ICFES."
publish_to: 'none'
version: 0.1.6+7

environment:
  sdk: ^3.11.3

dependencies:
  cloud_firestore: ^6.7.1
  cloud_functions: ^6.3.5
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  go_router: ^17.3.0
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  percent_indicator: ^4.2.5
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/questions_v1.json
    - assets/icons/
    - assets/brand/
